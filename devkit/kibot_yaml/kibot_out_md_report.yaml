# KiBot output for MD Report (e.g. README.md)
# https://kibot.readthedocs.io/en/latest/configuration/outputs/report.html

kibot:
  version: 1

outputs:
  - name: @NAME@
    comment: '@COMMENT@'
    type: report
    category: '@CATEGORY@'
    dir: '@DIR@'
    options:
      output: '@OUTPUT_NAME@.md'
      template: @TEMPLATE@
      # The template uses no images of the schematic or the PCB. Otherwise KiBot
      # splits their PDFs and leaves one file per page in the output directories
      collect_images: 'no'

...
definitions:
  NAME: md_readme
  COMMENT: Report
  DIR: .
  CATEGORY: /
  OUTPUT_NAME: README
  TEMPLATE: '@RESOURCES_DIR@/template/readme.txt'