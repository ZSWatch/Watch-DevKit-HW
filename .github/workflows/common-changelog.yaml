# =============================================================================
# Workflow: Changelog Check
# =============================================================================
#
# Trigger:
#   - pull_request: Targeting branches 'main' or 'master'
#   - push to branches 'main', 'master', or 'dev'
#
# Function:
#   Validates every CHANGELOG.md of the project (hardware, firmware, component).
#   Files from 'changelog_files' that do not exist are skipped, at least one must
#   exist. Checks that an [Unreleased] section is present and that its content only
#   contains valid section headers ("**Added:**", "**Changed:**", "**Fixed:**",
#   "**Removed:**"). Fails the workflow if the format is invalid.
#
# Variables:
#   changelog_files     - CHANGELOG.md files to validate, one per line
#                         (the hardware directory is replaced by the init script)
#
# Secrets:
#   (none)
# =============================================================================

name: Common / Changelog Check

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - dev

env:
  # Changelogs of the hardware, the firmware and an ESP-IDF component (repository root).
  # Missing files are skipped
  changelog_files: |
    devkit/CHANGELOG.md
    firmware/CHANGELOG.md
    CHANGELOG.md

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Changelog Format
        shell: bash
        run: |
          check_changelog() {
            CHANGELOG_FILE="$1"
            if [ ! -f "${CHANGELOG_FILE}" ]; then
              echo "Error: CHANGELOG.md not found in directory"
              exit 1
            fi

            echo "Validating CHANGELOG.md format..."

            # Check if [Unreleased] section exists
            if ! grep -q "\[Unreleased\]" "${CHANGELOG_FILE}"; then
              echo "Error: [Unreleased] section not found in CHANGELOG.md"
              exit 1
            fi

            # Extract [Unreleased] section content (stop at the next versioned ## [ header)
            UNRELEASED_CONTENT=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' "${CHANGELOG_FILE}")

            if [ -z "${UNRELEASED_CONTENT}" ]; then
              echo "Warning: [Unreleased] section is empty"
              exit 0
            fi

            echo "Checking [Unreleased] section content..."

            # Valid section headers (bold markdown format: **Added:** etc.)
            VALID_SECTIONS=("**Added:**" "**Changed:**" "**Fixed:**" "**Removed:**")

            # Check for valid section headers
            FOUND_SECTIONS=false
            for section in "${VALID_SECTIONS[@]}"; do
              if echo "${UNRELEASED_CONTENT}" | grep -qF "$section"; then
                FOUND_SECTIONS=true
                echo "Found section: $section"
              fi
            done

            if [ "${FOUND_SECTIONS}" = false ]; then
              echo "Error: No valid sections found in [Unreleased]"
              echo "Expected sections: Added, Changed, Fixed, Removed"
              exit 1
            fi

            # Validate entry format: must start with "- " (dash + space/tab)
            ERROR_COUNT=0
            LINE_NUMBER=0

            echo ""
            echo "Validating entry format..."

            while IFS= read -r line; do
              LINE_NUMBER=$((LINE_NUMBER + 1))

              # Skip empty lines, ### headers, and **Bold:** section headers
              if [[ -z "$line" ]] || [[ "$line" =~ ^### ]] || [[ "$line" =~ ^\*\*[A-Za-z]+.*\*\*$ ]]; then
                continue
              fi

              # Check if line is an entry (starts with -)
              if [[ "$line" =~ ^[[:space:]]*- ]]; then
                echo "OK Line $LINE_NUMBER: Valid entry"
              elif [[ "$line" =~ ^[[:space:]]*[^-] ]]; then
                # Line has content but doesn't start with -
                echo "ERR Line $LINE_NUMBER: Entry must start with '- ' (dash + space)"
                echo "  Content: $line"
                ERROR_COUNT=$((ERROR_COUNT + 1))
              fi
            done <<< "${UNRELEASED_CONTENT}"

            echo ""
            if [ ${ERROR_COUNT} -gt 0 ]; then
              echo "=========================================="
              echo "Changelog validation FAILED"
              echo "=========================================="
              echo "Found ${ERROR_COUNT} error(s)"
              echo ""
              echo "Requirements:"
              echo "1. All entries must be grouped under: **Added:**, **Changed:**, **Fixed:**, or **Removed:**"
              echo "2. Each entry must start with '- ' (dash + space or tab)"
              echo ""
              echo "Example:"
              echo "## [Unreleased]"
              echo ""
              echo "**Added:**"
              echo ""
              echo "- New feature description"
              echo "- Another feature"
              echo ""
              echo "**Fixed:**"
              echo ""
              echo "- Bug fix description"
              echo ""
              exit 1
            else
              echo "=========================================="
              echo "Changelog validation PASSED"
              echo "=========================================="
              echo "All entries in [Unreleased] are properly formatted"
            fi
          }

          FOUND=0
          FAILED=0
          while IFS= read -r file; do
            if [ -z "${file}" ] || [ ! -f "${file}" ]; then
              continue
            fi
            FOUND=1
            echo "::group::${file}"
            # Subshell, because the checks leave with 'exit'
            ( check_changelog "${file}" ) || FAILED=1
            echo "::endgroup::"
          done <<< "${changelog_files}"

          if [ ${FOUND} -eq 0 ]; then
            echo "Error: No CHANGELOG.md found. Checked:"
            echo "${changelog_files}"
            exit 1
          fi
          exit ${FAILED}

      - name: Check for duplicate issue numbers
        shell: bash
        run: |
          check_changelog() {
            CHANGELOG_FILE="$1"
            echo "Checking for duplicate issue numbers in [Unreleased] section..."

            # Extract issue numbers from [Unreleased] section
            UNRELEASED_CONTENT=$(awk '/\[Unreleased\]/,/^## \[/' "${CHANGELOG_FILE}" | sed '1d;$d')

            if [ -z "${UNRELEASED_CONTENT}" ]; then
              echo "No content to check"
              exit 0
            fi

            # Extract all issue numbers
            ISSUE_NUMBERS=$(echo "${UNRELEASED_CONTENT}" | grep -oP '\(#\K[0-9]+(?=\))' || true)

            if [ -z "${ISSUE_NUMBERS}" ]; then
              echo "No issue numbers found"
              exit 0
            fi

            # Check for duplicates
            DUPLICATES=$(echo "${ISSUE_NUMBERS}" | sort | uniq -d)

            if [ -n "${DUPLICATES}" ]; then
              echo "Warning: Duplicate issue numbers found in [Unreleased] section:"
              echo "${DUPLICATES}" | while read -r issue; do
                echo "  - Issue #$issue appears multiple times"
              done
              echo ""
              echo "This is not an error, but you may want to review if this is intentional"
            else
              echo "âœ“ No duplicate issue numbers found"
            fi
          }

          FOUND=0
          FAILED=0
          while IFS= read -r file; do
            if [ -z "${file}" ] || [ ! -f "${file}" ]; then
              continue
            fi
            FOUND=1
            echo "::group::${file}"
            # Subshell, because the checks leave with 'exit'
            ( check_changelog "${file}" ) || FAILED=1
            echo "::endgroup::"
          done <<< "${changelog_files}"

          if [ ${FOUND} -eq 0 ]; then
            echo "Error: No CHANGELOG.md found. Checked:"
            echo "${changelog_files}"
            exit 1
          fi
          exit ${FAILED}
